[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: serve index.html for any path so refreshes and deep links work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Unofficial concept: keep every response out of search engines until the owner
# approves. Remove this block (and the robots meta tag in index.html) at launch.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
